name: Build & Deploy Discord Bot

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build-push-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build, test & push image
              run: |
                  IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/praccreminder
                  docker build -t $IMAGE:sha-${GITHUB_SHA::8} -t $IMAGE:latest .
                  docker run --rm -v "$PWD/test_bot.py:/app/test_bot.py:ro" $IMAGE:latest python test_bot.py
                  docker push --all-tags $IMAGE

            - name: Deploy to VPS (update compose & restart bot)
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  envs: GITHUB_SHA_REMOTE,GITHUB_REPOSITORY_OWNER
                  script: |
                      set -e
                      SHORT_SHA="${GITHUB_SHA_REMOTE:0:8}"
                      REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
                      IMAGE="ghcr.io/${REPO_OWNER}/praccreminder:sha-${SHORT_SHA}"
                      COMPOSE_FILE="/srv/pracc-reminder/docker-compose.yml"

                      echo "Updating docker-compose image for bot -> ${IMAGE}"
                      sed -i.bak -E "s|(image:[[:space:]]*ghcr.io/${REPO_OWNER}/praccreminder:)[^[:space:]]+|\1sha-${SHORT_SHA}|g" "$COMPOSE_FILE"

                      cd /srv/pracc-reminder

                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

                      docker compose pull bot || true
                      docker compose up -d --no-deps --build bot || docker compose up -d bot

                      docker image prune -f
              env:
                  GITHUB_SHA_REMOTE: ${{ github.sha }}
                  GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
